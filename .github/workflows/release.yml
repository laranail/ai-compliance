name: Release

# A tag push creates the GitHub release and publishes the npm packages to the registry the repository variable
# PUBLISH_REGISTRY names (npm when unset). A maintainer can publish an existing tag by hand to either registry,
# which is what .dev/tools/npm-release does:  gh workflow run release.yml -f tag=vX.Y.Z -f registry=github
# GitHub Packages (npm.pkg.github.com) needs no npm account: the run's own GITHUB_TOKEN publishes.
on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'An existing release tag to publish, e.g. v0.1.0'
        required: true
      registry:
        description: 'npm (registry.npmjs.org) or github (GitHub Packages)'
        type: choice
        options: [npm, github]
        default: npm

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  npm:
    name: Publish npm packages (lockstep) to ${{ inputs.registry || vars.PUBLISH_REGISTRY || 'npm' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Gated because npm is not configured yet. All three packages return 404 on
    # the registry, and `npm publish` answers E404 on the PUT -- npm's reply when
    # the scope has no trusted publisher for this workflow, rather than 403,
    # since it will not confirm whether a package exists. On a moving tag that
    # failure repeats on every push, and a permanently red release is one nobody
    # reads: the GitHub-release half of this workflow was broken for weeks behind
    # exactly that kind of noise.
    #
    # To enable: configure npm trusted publishing for @laranail/ai-compliance,
    # -react and -vue against this repository and workflow, then
    #
    #     gh variable set NPM_PUBLISH_ENABLED --body true --repo laranail/ai-compliance
    #
    # A repository variable, not the secret itself: the secrets context is not
    # available in a job-level `if`.
    if: ${{ vars.NPM_PUBLISH_ENABLED == 'true' }}
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
      packages: write # GitHub Packages, with the run's GITHUB_TOKEN
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      TARGET: ${{ inputs.registry || vars.PUBLISH_REGISTRY || 'npm' }}

    steps:
      - name: Check the tag
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$TAG' is not a release tag (vX.Y.Z)." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build workspaces
        run: npm run build

      - name: Vitest
        run: npx vitest run

      - name: Stamp the tag version on every workspace (lockstep)
        run: |
          version="${TAG#v}"
          # --allow-same-version because v0.1.0 is a moving tag: it is force-pushed on
          # every change, so this workflow re-runs against workspaces already stamped
          # with that version, and `npm version` exits 1 with "Version not changed".
          # That turned every routine tag move into a failed publish job.
          for pkg in core react vue; do
            npm version "$version" --no-git-tag-version --allow-same-version --workspace "packages/$pkg"
          done
          # the bindings depend on the core at the same version
          for pkg in react vue; do
            npm pkg set "dependencies.@laranail/ai-compliance=$version" --workspace "packages/$pkg"
          done

      # GitHub Packages is reached through its own userconfig, so the .npmrc
      # setup-node wrote for npm is untouched. The three packages move in
      # lockstep, so the core's version stands for all of them: one the
      # registry already has is reported, not failed, which also keeps the
      # moving v0.1.0 tag from failing on every move once it is published.
      - name: Check whether this version is already published
        id: published
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '@laranail:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$GITHUB_TOKEN" > "$RUNNER_TEMP/github-packages.npmrc"
          name="$(node -p "require('./packages/core/package.json').name")"
          version="${TAG#v}"
          if [ "$TARGET" = github ]; then
            found=$(npm view "$name@$version" version --userconfig "$RUNNER_TEMP/github-packages.npmrc" 2>/dev/null || true)
            label="GitHub Packages"
          else
            found=$(npm view "$name@$version" version 2>/dev/null || true)
            label=npm
          fi
          if [ "$found" = "$version" ]; then
            echo "already on $label: $name@$version"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # npm: trusted publishing (this repo + workflow are the packages' OIDC
      # trusted publisher), or an NPM_TOKEN secret when one is set; npm tries
      # OIDC before a token whenever the job can mint one, so the token route
      # hides the OIDC variables and loses provenance.
      # GitHub Packages: the run's own token; it signs no provenance.
      - name: Publish
        if: steps.published.outputs.exists != 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$TARGET" = github ]; then
            npm publish --workspaces --userconfig "$RUNNER_TEMP/github-packages.npmrc" --registry https://npm.pkg.github.com --provenance=false
          elif [ -n "$NPM_TOKEN" ]; then
            env -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
              NODE_AUTH_TOKEN="$NPM_TOKEN" npm publish --access public --workspaces --provenance=false
          else
            npm publish --provenance --access public --workspaces
          fi

  release:
    name: Publish GitHub release + SBOM
    # Only for a tag push: publishing an existing tag by hand leaves its release alone.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, fileinfo
          coverage: none

      - name: Install runtime dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: ai-compliance.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Extract this version's CHANGELOG section
        id: changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { f=1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md)
          {
            echo "body<<__CHANGELOG_EOF__"
            if [ -n "$notes" ]; then printf '%s\n' "$notes"; else
              echo "See [CHANGELOG.md](https://github.com/laranail/ai-compliance/blob/main/CHANGELOG.md)."
            fi
            echo
            echo "Full history: [CHANGELOG.md](https://github.com/laranail/ai-compliance/blob/main/CHANGELOG.md)."
            echo "__CHANGELOG_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          body: ${{ steps.changelog.outputs.body }}
          files: ai-compliance.cdx.json
