name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  npm:
    name: Publish npm packages (lockstep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Gated because npm is not configured yet. All three packages return 404 on
    # the registry, and `npm publish` answers E404 on the PUT -- npm's reply when
    # the scope has no trusted publisher for this workflow, rather than 403,
    # since it will not confirm whether a package exists. On a moving tag that
    # failure repeats on every push, and a permanently red release is one nobody
    # reads: the GitHub-release half of this workflow was broken for weeks behind
    # exactly that kind of noise.
    #
    # To enable: configure npm trusted publishing for @laranail/ai-compliance,
    # -react and -vue against this repository and workflow, then
    #
    #     gh variable set NPM_PUBLISH_ENABLED --body true --repo laranail/ai-compliance
    #
    # A repository variable, not the secret itself: the secrets context is not
    # available in a job-level `if`.
    if: ${{ vars.NPM_PUBLISH_ENABLED == 'true' }}
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build

      - name: Vitest
        run: npx vitest run

      - name: Stamp the tag version on every workspace (lockstep)
        run: |
          version="${GITHUB_REF_NAME#v}"
          # --allow-same-version because v0.1.0 is a moving tag: it is force-pushed on
          # every change, so this workflow re-runs against workspaces already stamped
          # with that version, and `npm version` exits 1 with "Version not changed".
          # That turned every routine tag move into a failed publish job.
          for pkg in core react vue; do
            npm version "$version" --no-git-tag-version --allow-same-version --workspace "packages/$pkg"
          done
          # the bindings depend on the core at the same version
          for pkg in react vue; do
            npm pkg set "dependencies.@laranail/ai-compliance=$version" --workspace "packages/$pkg"
          done

      # trusted publishing: the npm packages are configured with this repo +
      # workflow as their oidc trusted publisher, so no token secret exists
      - name: Publish with provenance
        run: npm publish --provenance --access public --workspaces

  release:
    name: Publish GitHub release + SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, fileinfo
          coverage: none

      - name: Install runtime dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: ai-compliance.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Extract this version's CHANGELOG section
        id: changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { f=1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md)
          {
            echo "body<<__CHANGELOG_EOF__"
            if [ -n "$notes" ]; then printf '%s\n' "$notes"; else
              echo "See [CHANGELOG.md](https://github.com/laranail/ai-compliance/blob/main/CHANGELOG.md)."
            fi
            echo
            echo "Full history: [CHANGELOG.md](https://github.com/laranail/ai-compliance/blob/main/CHANGELOG.md)."
            echo "__CHANGELOG_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          body: ${{ steps.changelog.outputs.body }}
          files: ai-compliance.cdx.json
