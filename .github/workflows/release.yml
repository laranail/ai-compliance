name: Release

# A tag push creates the GitHub release, and nothing else. The npm packages are NEVER published from a tag,
# because v0.1.0 is a moving tag and a published registry version is immutable: the first push publishes, every
# later move finds the version present and skips, and the registry freezes while the tag goes on moving. That is
# what happened here -- GitHub Packages holds @laranail/ai-compliance@0.1.0 from one of the early tag pushes.
# So the npm packages carry their OWN version in their manifests and are published by hand:
#     gh workflow run release.yml -f tag=vX.Y.Z -f registry=github      (or .dev/tools/npm-release)
# GitHub Packages (npm.pkg.github.com) needs no npm account: the run's own GITHUB_TOKEN publishes.
on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'An existing release tag to publish, e.g. v0.1.0'
        required: true
      registry:
        description: 'npm (registry.npmjs.org) or github (GitHub Packages)'
        type: choice
        options: [npm, github]
        default: npm

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  npm:
    name: Publish npm packages (lockstep) to ${{ inputs.registry || vars.PUBLISH_REGISTRY || 'npm' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # workflow_dispatch ONLY. A tag push must never reach this job: v0.1.0 moves, a registry version does not,
    # so an automatic publish can only ever fire once and then skip in silence for good. Publishing is a decision
    # a maintainer takes, on a version the manifests name -- see the header.
    #
    # NPM_PUBLISH_ENABLED stays as a second switch, so the job can be turned off without editing the workflow.
    # A repository variable, not the secret itself: the secrets context is not available in a job-level `if`.
    #
    #     gh variable set NPM_PUBLISH_ENABLED --body true --repo laranail/ai-compliance
    if: ${{ github.event_name == 'workflow_dispatch' && vars.NPM_PUBLISH_ENABLED == 'true' }}
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
      packages: write # GitHub Packages, with the run's GITHUB_TOKEN
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      TARGET: ${{ inputs.registry || vars.PUBLISH_REGISTRY || 'npm' }}

    steps:
      - name: Check the tag
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$TAG' is not a release tag (vX.Y.Z)." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build workspaces
        run: npm run build

      - name: Vitest
        run: npx vitest run

      # The version published is the one in the manifests, NOT the one in the tag. Deriving it from the tag is
      # what froze this package: the tag is permanently v0.1.0, so every release would be 0.1.0 for ever. The
      # three packages still move in lockstep with each other -- the core's manifest version is the release.
      - name: Pin the bindings to the core's version (lockstep)
        run: |
          version="$(node -p "require('./packages/core/package.json').version")"
          for pkg in react vue; do
            npm pkg set "dependencies.@laranail/ai-compliance=$version" --workspace "packages/$pkg"
          done
          echo "publishing @laranail/ai-compliance and bindings at $version (from the manifests)"
          test "$version" != "${TAG#v}" || echo "::warning::the manifest version equals the tag's; bump the manifests before publishing a release"


      # GitHub Packages is reached through its own userconfig, so the .npmrc setup-node wrote for npm is
      # untouched. The three packages move in lockstep, so the core's version stands for all of them. A version
      # the registry already has is reported rather than failed, so a re-run after a partial publish is safe --
      # but it is reported as a WARNING, because a run that published nothing must not read as a clean release.
      - name: Check whether this version is already published
        id: published
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '@laranail:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$GITHUB_TOKEN" > "$RUNNER_TEMP/github-packages.npmrc"
          name="$(node -p "require('./packages/core/package.json').name")"
          version="$(node -p "require('./packages/core/package.json').version")"
          if [ "$TARGET" = github ]; then
            found=$(npm view "$name@$version" version --userconfig "$RUNNER_TEMP/github-packages.npmrc" 2>/dev/null || true)
            label="GitHub Packages"
          else
            found=$(npm view "$name@$version" version 2>/dev/null || true)
            label=npm
          fi
          if [ "$found" = "$version" ]; then
            echo "::warning::$label already has $name@$version -- nothing was published; a registry version is immutable, so bump the manifests to release new code."
            echo "already on $label: $name@$version"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # npm: trusted publishing (this repo + workflow are the packages' OIDC
      # trusted publisher), or an NPM_TOKEN secret when one is set; npm tries
      # OIDC before a token whenever the job can mint one, so the token route
      # hides the OIDC variables and loses provenance.
      # GitHub Packages: the run's own token; it signs no provenance.
      - name: Publish
        if: steps.published.outputs.exists != 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$TARGET" = github ]; then
            npm publish --workspaces --userconfig "$RUNNER_TEMP/github-packages.npmrc" --registry https://npm.pkg.github.com --provenance=false
          elif [ -n "$NPM_TOKEN" ]; then
            env -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
              NODE_AUTH_TOKEN="$NPM_TOKEN" npm publish --access public --workspaces --provenance=false
          else
            npm publish --provenance --access public --workspaces
          fi

  release:
    name: Publish GitHub release + SBOM
    # Only for a tag push: publishing an existing tag by hand leaves its release alone.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, fileinfo
          coverage: none

      - name: Install runtime dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: ai-compliance.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Extract this version's CHANGELOG section
        id: changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { f=1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md)
          {
            echo "body<<__CHANGELOG_EOF__"
            if [ -n "$notes" ]; then printf '%s\n' "$notes"; else
              echo "See [CHANGELOG.md](https://github.com/laranail/ai-compliance/blob/main/CHANGELOG.md)."
            fi
            echo
            echo "Full history: [CHANGELOG.md](https://github.com/laranail/ai-compliance/blob/main/CHANGELOG.md)."
            echo "__CHANGELOG_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          body: ${{ steps.changelog.outputs.body }}
          files: ai-compliance.cdx.json
